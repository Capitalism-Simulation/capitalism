<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Capitalism</title>
  <meta name="description" content="돈이냐 사랑이냐, 7일 생존 텍스트 어드벤처">
  <meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151413" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='9' cy='11' r='5' fill='%23e5484d'/%3E%3Ccircle cx='23' cy='11' r='5' fill='%233e63dd'/%3E%3Ccircle cx='9' cy='23' r='5' fill='%232f9e66'/%3E%3Ccircle cx='23' cy='23' r='5' fill='%232b2a28'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <!-- Loading / error -->
    <section class="screen screen-center" id="screen-loading">
      <p class="muted" id="loading-message">불러오는 중…</p>
    </section>

    <!-- Title -->
    <section class="screen screen-center" id="screen-title" hidden>
      <div class="hair-dots" aria-hidden="true">
        <span style="--c: var(--lover-0)"></span><span style="--c: var(--lover-1)"></span>
        <span style="--c: var(--lover-2)"></span><span style="--c: var(--lover-3)"></span>
      </div>
      <h1 class="wordmark">Capitalism</h1>
      <p class="tagline">돈이냐 사랑이냐, 7일 생존기</p>
      <p class="intro muted">통장 잔고를 지키면서 알록달록 머리 넷 중 한 명에게 고백하세요.<br>잔고가 0원이 되면 그대로 끝입니다.</p>
      <div class="stack">
        <button class="btn primary big" id="btn-start" type="button">시작하기</button>
        <button class="btn ghost" id="btn-collection" type="button">엔딩 도감 <span id="title-collection-count"></span></button>
      </div>
    </section>

    <!-- Setup -->
    <section class="screen" id="screen-setup" hidden>
      <button class="link-back" type="button" data-go="title">← 처음으로</button>
      <h2 class="screen-title">새 게임</h2>
      <form id="setup-form" class="setup" autocomplete="off">
        <label class="field">
          <span class="field-label">이름</span>
          <input id="input-name" name="name" type="text" maxlength="12" placeholder="이름을 입력하세요" required>
        </label>
        <fieldset class="field">
          <legend class="field-label">직업</legend>
          <div class="choice-grid" id="job-options"></div>
        </fieldset>
        <fieldset class="field">
          <legend class="field-label">난이도</legend>
          <div class="segmented" id="difficulty-options"></div>
        </fieldset>
        <button class="btn primary big" type="submit" id="btn-begin">7일 시작</button>
      </form>
    </section>

    <!-- Game -->
    <section class="screen screen-game" id="screen-game" hidden>
      <header class="status" id="status">
        <div class="status-top">
          <span class="status-who" id="status-who"></span>
          <span class="pill" id="status-time"></span>
        </div>
        <div class="status-balance">
          <span class="status-label">잔고</span>
          <strong id="status-balance">0원</strong>
          <span class="delta" id="status-delta" aria-live="polite"></span>
        </div>
        <div class="days" id="status-days" aria-hidden="true"></div>
      </header>
      <article class="panel" id="panel" aria-live="polite"></article>
      <div class="controls" id="controls"></div>
    </section>

    <!-- Result -->
    <section class="screen" id="screen-result" hidden>
      <div class="result-card" id="result-card">
        <p class="eyebrow" id="result-who"></p>
        <h2 class="result-title" id="result-title"></h2>
        <p class="result-text" id="result-text"></p>
        <dl class="result-stats">
          <div><dt>최종 잔고</dt><dd id="result-balance"></dd></div>
          <div><dt>고백 상대</dt><dd id="result-lover"></dd></div>
        </dl>
        <div class="affection" id="result-affection"></div>
        <p class="muted small" id="result-rule"></p>
      </div>
      <div class="actions">
        <button class="btn primary" type="button" id="btn-again">다시 하기</button>
        <button class="btn" type="button" id="btn-share">결과 공유</button>
        <button class="btn" type="button" id="btn-image">이미지 저장</button>
        <button class="btn ghost" type="button" data-go="collection">엔딩 도감</button>
        <button class="btn ghost" type="button" data-go="title">처음으로</button>
      </div>
    </section>

    <!-- Collection -->
    <section class="screen" id="screen-collection" hidden>
      <button class="link-back" type="button" data-go="title">← 처음으로</button>
      <h2 class="screen-title">엔딩 도감 <span class="muted" id="collection-count"></span></h2>
      <div id="collection-list"></div>
      <button class="btn ghost small" type="button" id="btn-reset-collection">도감 초기화</button>
    </section>
  </main>

  <div class="toast" id="toast" role="status" hidden></div>
  <script src="game.js"></script>
</body>
</html>
