name: Deploy web

on:
  push:
    branches: [main]
    paths: ["web/**", "data/**", "tools/check_data.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Build and deploy are separate jobs (GitHub's recommended layout): the deploy job only
# starts after the uploaded artifact is fully registered, which avoids the
# "No artifacts named github-pages" race seen when both steps ran in one job.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate game data
        run: python3 tools/check_data.py

      - name: Assemble site (web/ + data/)
        run: |
          mkdir _site
          cp -r web/. _site/
          cp -r data _site/data

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
